<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login – Lost & Found</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-wrap { width: 100%; max-width: 420px; padding: 0 20px; }
        .auth-logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 32px;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .auth-logo span { color: var(--accent); }
        .auth-title {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--text);
            margin-bottom: 6px;
        }
        .auth-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
        form { margin: 0; padding: 32px; }
        .field { margin-bottom: 18px; }
        .field label { margin-top: 0; margin-bottom: 7px; }
        .grid-overlay {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        form { position: relative; z-index: 1; }
        .auth-wrap { position: relative; z-index: 1; }
    </style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="auth-wrap">
    <div class="auth-logo">Lost<span>&</span>Found</div>
    <form action="login.php" method="POST">
        <div class="auth-title">Welcome back</div>
        <div class="auth-sub">Sign in to your account to continue</div>

        <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
            <label for="pass">Password</label>
            <input type="password" id="pass" name="pass" placeholder="••••••••" required>
        </div>

        <input type="submit" value="Sign In →">

        <div class="form-footer">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
    </form>
</div>
</body>
</html>
