    <p>Help reunite this item with its owner.</p>

<form action="found.php" method="POST" enctype="multipart/form-data">
    <label for="item">Item Name</label>
    <input type="text" id="item" name="item" placeholder="e.g. Blue backpack, car keys" required>

    <label for="desc">Description</label>
    <textarea id="desc" name="desc" rows="3" placeholder="Colour, brand, any markings..." required></textarea>

    <label for="loc">Where You Found It</label>
    <input type="text" id="loc" name="loc" placeholder="e.g. Near main gate, Parking lot A" required>

    <label for="img">Upload Photo</label>
    <input type="file" id="img" name="img" accept="image/*" required>
    <div class="file-hint">JPG, PNG, WEBP — max 5MB</div>

    <div class="form-footer"><a href="index.php">← Back to Dashboard</a></div>
