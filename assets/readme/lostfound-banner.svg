<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Lost &amp; Found — report what you have lost, return what you have found" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Lost &amp; Found</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a16"/>
      <stop offset="1" stop-color="#0f1236"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.12" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.85" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#8b4dff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#b9c8ff"/>
      <stop offset="1" stop-color="#c4a8ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#8b4dff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6c63ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glowL)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glowR)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#6c63ff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Text -->
  <text x="64" y="104" fill="#22d3ee" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">REPORT  ·  SEARCH  ·  RECONNECT</text>
  <text x="62" y="174" fill="url(#title)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="800" textLength="440" lengthAdjust="spacingAndGlyphs">Lost &amp; Found</text>
  <text x="64" y="216" fill="#b3bddb" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" textLength="440" lengthAdjust="spacingAndGlyphs">Report what you lost. Return what you found.</text>
  <rect x="64" y="238" width="90" height="5" rx="2.5" fill="url(#ring)"/>

  <!-- Floating belongings -->
  <!-- Bag -->
  <g transform="translate(700 120) rotate(-8)">
    <path d="M22 18 C22 -8 78 -8 78 18" fill="none" stroke="#7c8cff" stroke-width="8" stroke-linecap="round"/>
    <rect x="0" y="14" width="100" height="78" rx="16" fill="#18204a" stroke="#4f7bff" stroke-width="3"/>
    <rect x="0" y="36" width="100" height="6" fill="#4f7bff" fill-opacity="0.45"/>
    <rect x="40" y="30" width="20" height="18" rx="4" fill="#0b1030" stroke="#22d3ee" stroke-width="2.5"/>
  </g>
  <g transform="translate(690 236)">
    <rect width="66" height="26" rx="13" fill="#ff6584" fill-opacity="0.18" stroke="#ff6584" stroke-width="1.5"/>
    <text x="33" y="18" text-anchor="middle" fill="#ff8fa6" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">LOST</text>
  </g>

  <!-- Magnifier with key -->
  <g transform="translate(900 128)">
    <circle r="82" fill="#0b1030" fill-opacity="0.7"/>
    <circle r="82" fill="none" stroke="url(#ring)" stroke-width="12"/>
    <line x1="58" y1="58" x2="112" y2="112" stroke="url(#ring)" stroke-width="17" stroke-linecap="round"/>
    <!-- key -->
    <g transform="rotate(-35)" fill="none" stroke="#e8eeff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-34" cy="0" r="17"/>
      <circle cx="-34" cy="0" r="5" fill="#e8eeff" stroke="none"/>
      <path d="M-17 0 H44 M28 0 V15 M44 0 V12"/>
    </g>
    <circle cx="-52" cy="-52" r="5" fill="#ffffff" fill-opacity="0.35"/>
  </g>

  <!-- Phone -->
  <g transform="translate(1085 80) rotate(12)">
    <rect width="72" height="126" rx="15" fill="#18204a" stroke="#8b4dff" stroke-width="3.5"/>
    <rect x="8" y="14" width="56" height="92" rx="7" fill="#0b1030"/>
    <circle cx="36" cy="52" r="13" fill="none" stroke="#22d3a5" stroke-width="4"/>
    <path d="M36 70 L36 52" stroke="#22d3a5" stroke-width="4" stroke-linecap="round" opacity="0"/>
    <path d="M25 90 H47" stroke="#4f7bff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="36" cy="116" r="3.5" fill="#4f7bff"/>
  </g>
  <g transform="translate(1062 232)">
    <rect width="78" height="26" rx="13" fill="#22d3a5" fill-opacity="0.16" stroke="#22d3a5" stroke-width="1.5"/>
    <text x="39" y="18" text-anchor="middle" fill="#5eead4" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">FOUND</text>
  </g>

  <!-- Sparkles -->
  <g fill="#22d3ee">
    <circle cx="600" cy="60" r="3" opacity="0.8"/>
    <circle cx="790" cy="40" r="2.5" opacity="0.6"/>
    <circle cx="1020" cy="48" r="3" opacity="0.7"/>
    <circle cx="1160" cy="240" r="2.5" opacity="0.6"/>
    <circle cx="610" cy="262" r="2" opacity="0.5"/>
  </g>
  <g fill="#8b4dff">
    <circle cx="760" cy="262" r="3" opacity="0.7"/>
    <circle cx="1150" cy="50" r="2.5" opacity="0.7"/>
  </g>
</svg>
